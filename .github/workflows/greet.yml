name: Greet new contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Thanks for opening your first issue here! Please check our CONTRIBUTING.md and fill out the issue template. We will get back to you soon!
          pr-message: 'Thanks for opening your first pull request! Please make sure you have read CONTRIBUTING.md. We appreciate your contribution!'
